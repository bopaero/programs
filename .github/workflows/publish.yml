name: Publish

# Every push to main (a wording change), and every run started by refresh.yml when a
# source changed, rebuilds the PDFs from the pages and deploys the site and the PDFs
# TOGETHER, so the site can never show new figures beside an old PDF.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # archive versions/*.pdf
  issues: write       # tell Raymond when the LOI changed (his DocuSign template holds a copy)
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true   # the newest run reads the newest sources

jobs:
  publish:
    # Pinned to the same image as the SF50 and SR22T sites (their PDFs were compared on it)
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools and fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ttf-mscorefonts-installer >/dev/null
          fc-cache -f >/dev/null
          fc-list | grep -qi "arial" || { echo "Arial missing — layout would not match"; exit 1; }

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html loi.html comparison.html founders-insert.html founders-detail.html CNAME robots.txt assets data versions _site/

      - name: Build PDFs (fails the publish unless every document has its exact pages, versioned, clean)
        run: python3 tools/build-pdf.py --out _site --archive | tee build.log

      - name: Archive new versions
        run: |
          added=$(sed -n 's/^ARCHIVED //p' build.log)
          if [ -n "$added" ]; then
            cp $added _site/versions/
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $added
            git commit -m "Archive $(echo $added | wc -w | tr -d ' ') PDF version(s) [skip ci]"
            # Another run may have archived meanwhile (same files): rebase onto it, keep theirs on a clash
            git pull --rebase -X theirs -q || { git rebase --abort; echo "Archive push skipped"; exit 0; }
            git push
          fi

      - name: Note the live LOI before replacing it
        run: curl -fsS -o /tmp/loi-live.pdf "https://programs.bopaero.com/bop-Aero-Letter-of-Intent.pdf?t=$(date +%s)" || rm -f /tmp/loi-live.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # The DocuSign template keeps its own copy of the LOI PDF (Raymond 2026-10-24), so every
      # deployed change to it (wording or either costing) opens an issue, which GitHub emails him
      - name: Tell Raymond to replace the LOI in the DocuSign template
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stamp() { pdftotext "$1" - 2>/dev/null | grep -m1 -oE 'LOI v[0-9.-]+ · SR22T v[0-9.-]+ · SF50 v[0-9.-]+'; }
          tags() { pdftotext "$1" - 2>/dev/null | grep -oE '\\[om]_[a-z0-9_]+\\' | sort; }
          new=$(stamp _site/bop-Aero-Letter-of-Intent.pdf)
          old=$( [ -f /tmp/loi-live.pdf ] && stamp /tmp/loi-live.pdf || echo "unknown")
          echo "LOI before: $old"; echo "LOI now:    $new"
          [ "$new" = "$old" ] && { echo "LOI unchanged."; exit 0; }
          added=$(comm -13 <( [ -f /tmp/loi-live.pdf ] && tags /tmp/loi-live.pdf ) <(tags _site/bop-Aero-Letter-of-Intent.pdf) | tr '\n' ' ')
          removed=$(comm -23 <( [ -f /tmp/loi-live.pdf ] && tags /tmp/loi-live.pdf ) <(tags _site/bop-Aero-Letter-of-Intent.pdf) | tr '\n' ' ')
          {
            echo "The Letter of Intent PDF changed, so the copy in the DocuSign LOI template is out of date."
            echo
            echo "- Was: \`$old\`"
            echo "- Now: \`$new\`"
            echo
            echo "**To do:** replace the document in the DocuSign template with the Google Drive copy: Shared drives → bop Aero - Admin → 1. Company & Legal → Agreements → LOIs → bop-Aero-Letter-of-Intent.pdf. Your Mac refreshes it within 15 minutes of this issue; check that its footer reads \`${new%% ·*}\`. The fields are placed by the anchor tags, so they follow the new layout."
            if [ -n "$added$removed" ]; then
              echo
              echo "**The fields changed.** Add or delete these fields in the template:"
              [ -n "$added" ] && echo "- New tags: \`$added\`"
              [ -n "$removed" ] && echo "- Gone: \`$removed\`"
            fi
            echo
            echo "Close this issue once the template is updated."
          } > /tmp/body.md
          gh issue create --title "Replace the LOI in the DocuSign template (${new%% ·*})" --body-file /tmp/body.md
